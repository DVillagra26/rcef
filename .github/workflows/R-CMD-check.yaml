on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      # The three vignettes read real CEF csv files under inst/extdata, which is
      # git-ignored and only exists on the developer's machine, so they cannot
      # be built here.
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran", "--ignore-vignettes")'
          build_args: 'c("--no-build-vignettes")'
          error-on: '"error"'

      - name: Structural checks
        run: |
          Rscript dev/check_syntax.R
          Rscript dev/check_exports.R
        shell: bash
